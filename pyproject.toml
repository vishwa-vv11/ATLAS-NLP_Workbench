[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-text-intelligence"
version = "0.1.0"
description = "A modular classical NLP learning project"
requires-python = ">=3.10"
dependencies = [
    "nltk>=3.8,<4",
    "numpy>=1.24,<3",
    "scikit-learn>=1.3,<2",
    "gensim>=4.4,<5",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]
app = [
    "streamlit>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
